<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="rutiGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="65%" stop-color="#fde68a" />
      <stop offset="90%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="240" r="176" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- Main Fresh Puffed Ruti -->
  <circle cx="256" cy="235" r="150" fill="url(#rutiGrad)" filter="url(#shadow)" />
  
  <!-- Brown Toasting Spots on Ruti -->
  <circle cx="210" cy="180" r="14" fill="#92400e" opacity="0.65" />
  <circle cx="295" cy="175" r="18" fill="#78350f" opacity="0.7" />
  <circle cx="330" cy="235" r="12" fill="#92400e" opacity="0.6" />
  <circle cx="265" cy="265" r="16" fill="#78350f" opacity="0.6" />
  <circle cx="195" cy="255" r="13" fill="#92400e" opacity="0.65" />
  <circle cx="245" cy="210" r="11" fill="#78350f" opacity="0.55" />
  <circle cx="310" cy="290" r="10" fill="#92400e" opacity="0.5" />
  <circle cx="180" cy="205" r="9" fill="#78350f" opacity="0.5" />

  <!-- Speed Lines / 15-Min badge -->
  <g transform="translate(180, 375)">
    <rect x="-30" y="0" width="212" height="54" rx="27" fill="#1c1917" />
    <rect x="-28" y="2" width="208" height="50" rx="25" fill="#292524" />
    <circle cx="-3" cy="27" r="14" fill="#ef4444" />
    <path d="M-8 27 L-4 31 L2 21" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" letter-spacing="0.5">15 MIN HOT</text>
  </g>
  
  <!-- BRN monogram in top corner -->
  <text x="256" y="90" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4">BRN</text>
  <text x="256" y="118" text-anchor="middle" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="1">MIRPUR 11 &amp; 12</text>
</svg>
